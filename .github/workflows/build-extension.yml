name: Build Chrome Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build:chrome

      - name: Package extension ZIP
        run: cd dist_chrome && zip -r ../voyager-chrome-extension.zip .

      - name: Upload compiled extension (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: voyager-chrome-extension
          path: dist_chrome/

      - name: Publish Public Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Hardened Build
          body: Automated zero-egress Chrome extension build from `main`.
          files: voyager-chrome-extension.zip
